name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe it below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What gap does it fill?
      placeholder: "I'm frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Dashboard (Project-Manager-Dashboard)
        - Agent Commands
        - Agent Skills
        - Documentation System
        - IDE Sync / Portability
        - CI Pipeline
        - Testing Infrastructure
        - New Component
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or reference links.
